name: Consolidated CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consolidated-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MEMORIST_E2E_STUB_KEY: memorist-e2e-secret-canary-000000000000

jobs:
  quality-unit-ui:
    name: Quality, Unit, Integration, and UI
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
          cache-dependency-glob: |
            memorist-core/pyproject.toml
            memorist-core/uv.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies once
        working-directory: memorist-core
        run: uv sync --all-extras --quiet

      - name: Backend lint, format, and strict types
        working-directory: memorist-core
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src tests
          git diff --check

      - name: Core tests without external services
        working-directory: memorist-core
        run: |
          uv run pytest -q --tb=short \
            --junitxml="${RUNNER_TEMP}/core-unit-results.xml"

      - name: Open WebUI adapter and filter tests
        working-directory: memorist-core
        run: |
          uv run pytest ../open-webui-integration/memorist/tests -q --tb=short \
            --junitxml="${RUNNER_TEMP}/openwebui-integration-results.xml"

      - name: Install frontend dependencies once
        run: npm ci --no-audit --no-fund

      - name: Frontend tests, types, and lint
        run: |
          npm test -- --reporter=junit --outputFile="${RUNNER_TEMP}/frontend-results.xml"
          npm run typecheck
          npm run lint

      - name: Documentation and repository hygiene
        run: |
          set -euo pipefail
          for f in README.md LICENSE SECURITY.md CONTRIBUTING.md RELEASE_NOTES.md \
                   docs/ARCHITECTURE.md docs/INSTALLATION.md docs/MEMORY_MACHINE.md \
                   docs/DEVELOPMENT.md docs/TROUBLESHOOTING.md docs/reference/README.md; do
            test -f "$f" || { echo "MISSING $f"; exit 1; }
          done
          python3 scripts/check_doc_links.py
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^e]|\.zip$|\.sqlite$|\.db$|\.log$|\.tmp$' || true)
          test -z "$bad" || { echo "FORBIDDEN tracked files:"; echo "$bad"; exit 1; }
          bad=$(git grep -lIE "claude\.ai/code/session|Generated with \[Claude Code\]|Co-Authored-By: Claude" -- . ':!.github/workflows/public-release-readiness.yml' || true)
          test -z "$bad" || { echo "Agent artifacts found in:"; echo "$bad"; exit 1; }
          bad=$(git grep -nIE "sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA |EC )?PRIVATE KEY" -- . \
            | grep -vF 'sk-memorist-e2e-canary-000000000000' || true)
          test -z "$bad" || { echo "Secret-like content found:"; echo "$bad"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: consolidated-quality-results
          path: |
            ${{ runner.temp }}/core-unit-results.xml
            ${{ runner.temp }}/openwebui-integration-results.xml
            ${{ runner.temp }}/frontend-results.xml

  postgres-graph:
    name: PostgreSQL, Full Runtime, and FalkorDB
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memorist
          POSTGRES_PASSWORD: memorist
          POSTGRES_DB: memorist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memorist -d memorist_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      falkordb:
        image: falkordb/falkordb:v4.18.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      MEMORIST_RUNTIME_PROFILE: full
      MEMORIST_CANONICAL_STORE: postgres
      MEMORIST_POSTGRES_DSN: postgresql://memorist:memorist@localhost:5432/memorist_test
      MEMORIST_GRAPH_BACKEND: disabled
      MEMORIST_ALLOW_FULL_GRAPH_DEGRADED: "true"
      MEMORIST_HOT_SCHEDULER: in_memory
      MEMORIST_OBJECT_STORE_PATH: /tmp/memorist-objects
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
          cache-dependency-glob: |
            memorist-core/pyproject.toml
            memorist-core/uv.lock
          cache-suffix: postgres-graph

      - name: Install backend dependencies once
        working-directory: memorist-core
        run: uv sync --all-extras --quiet

      - name: Complete fresh-PostgreSQL suite
        working-directory: memorist-core
        run: |
          uv run pytest -q --tb=short \
            --junitxml="${RUNNER_TEMP}/postgres-results.xml"

      - name: Create a separate clean database for graph assertions
        working-directory: memorist-core
        run: |
          uv run python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://memorist:memorist@localhost:5432/postgres",
              autocommit=True,
          ) as connection:
              connection.execute("DROP DATABASE IF EXISTS memorist_graph_test WITH (FORCE)")
              connection.execute("CREATE DATABASE memorist_graph_test")
          PY

      - name: Real FalkorDB retrieval and explicit degraded mode
        working-directory: memorist-core
        env:
          MEMORIST_POSTGRES_DSN: postgresql://memorist:memorist@localhost:5432/memorist_graph_test
          MEMORIST_GRAPH_BACKEND: falkordb
          MEMORIST_FALKORDB_URL: redis://localhost:6379
          MEMORIST_REAL_FALKORDB: "1"
        run: |
          uv run pytest tests/test_memory_control_contract_full.py \
            -k "full_graph_retrieval or full_graph_outage" -q --tb=short \
            --junitxml="${RUNNER_TEMP}/graph-results.xml"
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/graph-results.xml").getroot()
          cases = list(root.iter("testcase"))
          skipped = list(root.iter("skipped"))
          assert len(cases) == 2 and not skipped, (len(cases), len(skipped))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: consolidated-postgres-graph-results
          path: |
            ${{ runner.temp }}/postgres-results.xml
            ${{ runner.temp }}/graph-results.xml

  package-release:
    name: Package, Production Frontend, and Lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Require Docker, Compose, and PowerShell once
        run: |
          bash .github/scripts/ensure-compose.sh --require-docker
          bash .github/scripts/ensure-pwsh.sh

      - name: Installer, Compose, and committed checksum validation
        run: |
          python3 installer/scripts/validate_installer.py --dry-run
          python3 installer/scripts/validate_compose.py
          python3 release/memorist-openwebui/scripts/gen_checksums.py --check
          find release/memorist-openwebui/scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Install Pester once
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pester = Get-Module -ListAvailable -Name Pester |
            Where-Object { $_.Version -ge [version]'5.5.0' } |
            Sort-Object Version -Descending | Select-Object -First 1
          if (-not $pester) {
            if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
              Register-PSRepository -Default
            }
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module Pester -RequiredVersion 5.6.1 -Force -Scope CurrentUser -AllowClobber
          }

      - name: Parse and test all lifecycle and installer scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem release/memorist-openwebui -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw "PowerShell parse failed: $($_.FullName)" }
          }
          Import-Module Pester -MinimumVersion 5.5 -Force
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = 'release/memorist-openwebui/tests'
          $configuration.Run.PassThru = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = "$env:RUNNER_TEMP/pester-results.xml"
          $configuration.TestResult.OutputFormat = 'NUnitXml'
          $result = Invoke-Pester -Configuration $configuration
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Build and inspect the production Open WebUI frontend
        env:
          APP_BUILD_HASH: consolidated-${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=8192
          CYPRESS_INSTALL_BINARY: "0"
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
          npm_config_onnxruntime_node_install_cuda: skip
        run: |
          set -euo pipefail
          url=$(python3 -c "import json;print(json.load(open('release/openwebui-image/source-pin.json'))['source_snapshot']['url'])")
          sha=$(python3 -c "import json;print(json.load(open('release/openwebui-image/source-pin.json'))['source_snapshot']['sha256'])")
          curl -sSL --retry 4 -o "${RUNNER_TEMP}/openwebui-src.tar.gz" "$url"
          echo "$sha  ${RUNNER_TEMP}/openwebui-src.tar.gz" | sha256sum -c -
          sh release/openwebui-image/prepare_frontend_tree.sh \
            "${RUNNER_TEMP}/openwebui-src.tar.gz" \
            "${RUNNER_TEMP}/src-tree" \
            "$(pwd)/release/openwebui-image" \
            "$(pwd)/open-webui-integration/memorist/ui"
          cd "${RUNNER_TEMP}/src-tree"
          npm ci --force --fetch-retries=5
          npm run build
          build="${RUNNER_TEMP}/src-tree/build"
          test -f "$build/index.html"
          for marker in "Memory Setup" "Processing Nodes" "Memory used" \
            "memorist-memory-workflow-toggle" "memorist-message-disclosure" \
            "memorist-diagnostics" "/api/v1/memorist"; do
            grep -rl --include='*.js' -- "$marker" "$build/_app" >/dev/null \
              || { echo "MISSING BUNDLE MARKER: $marker"; exit 1; }
          done

      - name: Assemble the release archive once
        run: |
          set -euo pipefail
          rm -rf release/rc
          python3 installer/scripts/assemble_rc.py
          mapfile -t archives < <(find release/rc -maxdepth 1 -type f -name 'memorist-openwebui-*.zip' | sort)
          test "${#archives[@]}" -eq 1
          python3 installer/scripts/validate_package.py "${archives[0]}"
          python3 release/tests/rc_package_schema.py > "${RUNNER_TEMP}/rc-package-schema.json"
          python3 release/tests/version_consistency.py > "${RUNNER_TEMP}/version-consistency.json"
          python3 release/tests/upgrade_contract.py > "${RUNNER_TEMP}/upgrade-contract.json"
          sha256sum "${archives[0]}" > "${RUNNER_TEMP}/zip-digest.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consolidated-release-package
          path: |
            release/rc/*.zip
            release/rc/*.sha256
            release/package-manifest.ijson
            ${{ runner.temp }}/pester-results.xml
            ${{ runner.temp }}/rc-package-schema.json
            ${{ runner.temp }}/version-consistency.json
            ${{ runner.temp }}/upgrade-contract.json
            ${{ runner.temp }}/zip-digest.txt

  product-e2e:
    name: One Deployment Product E2E
    needs: [quality-unit-ui, postgres-graph, package-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MEMORIST_E2E_WORKDIR: ${{ github.workspace }}/.consolidated-e2e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: consolidated-release-package
          path: release/rc

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Require Docker, Compose, and PowerShell once
        run: |
          bash .github/scripts/ensure-compose.sh --require-docker
          bash .github/scripts/ensure-pwsh.sh

      - name: Extract the already-built package
        run: |
          set -euo pipefail
          mapfile -t archives < <(find release/rc -maxdepth 1 -type f -name 'memorist-openwebui-*.zip' | sort)
          test "${#archives[@]}" -eq 1
          target="${RUNNER_TEMP}/Memorist Final Test"
          rm -rf "$target" && mkdir -p "$target"
          python3 -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "${archives[0]}" "$target"
          package_dir=$(find "$target" -maxdepth 1 -mindepth 1 -type d)
          test -n "$package_dir"
          echo "MEMORIST_PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"
          project="memorist_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "MEMORIST_CI_PROJECT=$project" >> "$GITHUB_ENV"
          echo "MEMORIST_CI_NETWORK=${project}_default" >> "$GITHUB_ENV"

      - name: Build the derivative image once
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: |
          set -o pipefail
          docker build \
            -t memorist/openwebui:0.2.0-beta.3-ci \
            -f "${MEMORIST_PACKAGE_DIR}/runtime/openwebui-image/Dockerfile" \
            "${MEMORIST_PACKAGE_DIR}/runtime" \
            2>&1 | tee "${RUNNER_TEMP}/docker-build.log"

      - name: Start deterministic model stub
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/stub-logs"
          stub_name="memorist-e2e-stub-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          provider_url="http://${stub_name}:9800/v1"
          echo "MEMORIST_E2E_STUB_CONTAINER=${stub_name}" >> "$GITHUB_ENV"
          echo "MEMORIST_E2E_PROVIDER_URL=${provider_url}" >> "$GITHUB_ENV"
          docker run -d --name "$stub_name" \
            -p 127.0.0.1:9800:9800 \
            -e PORT=9800 \
            -e REQUEST_LOG_PATH=/logs/requests.jsonl \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/tests/e2e/model-stub/server.py,dst=/stub/server.py,readonly" \
            --mount "type=bind,src=${RUNNER_TEMP}/stub-logs,dst=/logs" \
            --entrypoint python \
            memorist/openwebui:0.2.0-beta.3-ci \
            /stub/server.py
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9800/health && exit 0
            sleep 1
          done
          docker logs "$stub_name"
          exit 1

      - name: Configure isolated Full-mode package
        run: |
          set -euo pipefail
          pg_password=$(openssl rand -hex 16)
          {
            printf 'COMPOSE_PROJECT_NAME=%s\n' "$MEMORIST_CI_PROJECT"
            printf 'MEMORIST_MODE=full\n'
            printf 'MEMORIST_INSTALLATION_ID=%s\n' "$(python3 -c 'import uuid;print(uuid.uuid4())')"
            printf 'WEBUI_SECRET_KEY=%s\n' "$(openssl rand -hex 32)"
            printf 'MEMORIST_ACTOR_ASSERTION_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'MEMORIST_ACTOR_SERVICE_TOKEN=%s\n' "$(openssl rand -hex 32)"
            printf 'MEMORIST_OPENWEBUI_WORKSPACE_UUID=%s\n' "$(python3 -c 'import uuid;print(uuid.uuid4())')"
            printf 'MEMORIST_POSTGRES_PASSWORD=%s\n' "$pg_password"
            printf 'MEMORIST_POSTGRES_DSN=postgresql://memorist:%s@postgres:5432/memorist\n' "$pg_password"
            printf 'OPENAI_API_BASE_URL=%s\n' "$MEMORIST_E2E_PROVIDER_URL"
            printf 'OPENAI_API_KEY=%s\n' "$MEMORIST_E2E_STUB_KEY"
            printf 'ENABLE_OLLAMA_API=false\n'
            printf 'MEMORIST_MEMORY_EXTRACTION_API_KEY=stub-extraction-env-value\n'
            printf 'OPEN_WEBUI_PORT=3000\n'
            printf 'MEMORIST_CORE_HOST_PORT=8777\n'
            printf 'MEMORIST_PORT=8777\n'
          } > "${MEMORIST_PACKAGE_DIR}/.env"

      - name: Start the package once
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:MEMORIST_PACKAGE_DIR
          ./Start-Memorist.ps1 -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "Start-Memorist failed with $LASTEXITCODE" }

      - name: Attach stub and verify health and proxy contract
        run: |
          set -euo pipefail
          docker network connect --alias "$MEMORIST_E2E_STUB_CONTAINER" \
            "$MEMORIST_CI_NETWORK" "$MEMORIST_E2E_STUB_CONTAINER"
          cd "${MEMORIST_PACKAGE_DIR}"
          if [ -n "${MEMORIST_COMPOSE_BIN:-}" ]; then base="$MEMORIST_COMPOSE_BIN"; else base="docker compose"; fi
          compose="$base -f compose.yml -f compose.full.yml"
          $compose exec -T open-webui python -c \
            "import json,urllib.request; data=json.load(urllib.request.urlopen('${MEMORIST_E2E_PROVIDER_URL}/models', timeout=5)); assert data['data'][0]['id']=='memorist-e2e-stub'"
          $compose exec -T memorist-core python -c \
            "import json,urllib.request; data=json.load(urllib.request.urlopen('${MEMORIST_E2E_PROVIDER_URL}/models', timeout=5)); assert data['data'][0]['id']=='memorist-e2e-stub'"
          curl -sf http://localhost:3000/health
          code=$(curl -s -o /tmp/memorist-status.json -w "%{http_code}" -H "Accept: application/json" http://localhost:3000/api/v1/memorist/openwebui/status)
          test "$code" = "401"
          python3 -c "import json; d=json.load(open('/tmp/memorist-status.json')); assert 'detail' in d"
          ! grep -qi '<html' /tmp/memorist-status.json
          curl -sf http://localhost:8777/memcore/health | python3 -m json.tool

      - name: Install Playwright client once and pull browser image once
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save @playwright/test@1.49.1
          docker pull mcr.microsoft.com/playwright:v1.49.1-noble

      - name: Product E2E phase 1
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e MEMORIST_E2E_BASE_URL=http://localhost:3000 \
            -e MEMORIST_E2E_STUB_URL=http://localhost:9800 \
            -e MEMORIST_E2E_PROVIDER_URL="$MEMORIST_E2E_PROVIDER_URL" \
            -v "$PWD":/work -w /work \
            mcr.microsoft.com/playwright:v1.49.1-noble \
            npx playwright test --config tests/e2e/playwright.config.ts tests/e2e/product.spec.ts

      - name: Database truth after phase 1
        run: |
          set -euo pipefail
          cd "${MEMORIST_PACKAGE_DIR}"
          if [ -n "${MEMORIST_COMPOSE_BIN:-}" ]; then base="$MEMORIST_COMPOSE_BIN"; else base="docker compose"; fi
          compose="$base -f compose.yml -f compose.full.yml"
          captured=$($compose exec -T postgres psql -U memorist -d memorist -tA -c \
            "SELECT count(*) FROM openwebui_message_captures WHERE role='user' AND message_uuid IN (SELECT message_uuid FROM messages WHERE raw_text LIKE '%Alpha%')")
          test "$captured" = "1"
          off=$($compose exec -T postgres psql -U memorist -d memorist -tA -c \
            "SELECT count(*) FROM messages WHERE raw_text LIKE '%Umbra%'")
          test "$off" = "0"
          candidates=$($compose exec -T postgres psql -U memorist -d memorist -tA -c \
            "SELECT count(*) FROM memory_candidates")
          test "$candidates" != "0"
          secrets=$($compose exec -T postgres psql -U memorist -d memorist -tA -c \
            "SELECT count(*) FROM model_profiles WHERE model_profiles::text LIKE '%${MEMORIST_E2E_STUB_KEY}%'")
          test "$secrets" = "0"

      - name: Restart the same stack without redeploying
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:MEMORIST_PACKAGE_DIR
          & docker network disconnect $env:MEMORIST_CI_NETWORK $env:MEMORIST_E2E_STUB_CONTAINER
          if ($LASTEXITCODE -ne 0) { throw "Failed to detach model stub" }
          ./Stop-Memorist.ps1
          if ($LASTEXITCODE -ne 0) { throw "Stop-Memorist failed" }
          ./Start-Memorist.ps1 -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "Start-Memorist failed" }
          & docker network connect --alias $env:MEMORIST_E2E_STUB_CONTAINER $env:MEMORIST_CI_NETWORK $env:MEMORIST_E2E_STUB_CONTAINER
          if ($LASTEXITCODE -ne 0) { throw "Failed to reattach model stub" }

      - name: Product E2E phase 2
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e MEMORIST_E2E_BASE_URL=http://localhost:3000 \
            -e MEMORIST_E2E_STUB_URL=http://localhost:9800 \
            -e MEMORIST_E2E_PROVIDER_URL="$MEMORIST_E2E_PROVIDER_URL" \
            -v "$PWD":/work -w /work \
            mcr.microsoft.com/playwright:v1.49.1-noble \
            npx playwright test --config tests/e2e/playwright.config.ts tests/e2e/post-restart.spec.ts

      - name: Post-restart duplicate check
        run: |
          set -euo pipefail
          cd "${MEMORIST_PACKAGE_DIR}"
          if [ -n "${MEMORIST_COMPOSE_BIN:-}" ]; then base="$MEMORIST_COMPOSE_BIN"; else base="docker compose"; fi
          compose="$base -f compose.yml -f compose.full.yml"
          captured=$($compose exec -T postgres psql -U memorist -d memorist -tA -c \
            "SELECT count(*) FROM openwebui_message_captures WHERE role='user' AND message_uuid IN (SELECT message_uuid FROM messages WHERE raw_text LIKE '%Alpha%')")
          test "$captured" = "1"

      - name: Collect redacted diagnostics
        if: always()
        run: |
          set +e
          mkdir -p "${RUNNER_TEMP}/product-diagnostics"
          cp "${RUNNER_TEMP}/docker-build.log" "${RUNNER_TEMP}/product-diagnostics/" 2>/dev/null
          if [ -n "${MEMORIST_PACKAGE_DIR:-}" ] && [ -d "${MEMORIST_PACKAGE_DIR:-}" ]; then
            cd "${MEMORIST_PACKAGE_DIR}"
            if [ -n "${MEMORIST_COMPOSE_BIN:-}" ]; then base="$MEMORIST_COMPOSE_BIN"; else base="docker compose"; fi
            $base -f compose.yml -f compose.full.yml logs --no-color 2>/dev/null \
              | sed -e "s/${MEMORIST_E2E_STUB_KEY}/[redacted-canary]/g" \
                    -e 's/\(SECRET\|TOKEN\|PASSWORD\|API_KEY\)=[^ ]*/\1=[redacted]/g' \
              > "${RUNNER_TEMP}/product-diagnostics/compose.log"
          fi
          cp "${RUNNER_TEMP}/stub-logs/requests.jsonl" "${RUNNER_TEMP}/product-diagnostics/" 2>/dev/null
          docker logs "${MEMORIST_E2E_STUB_CONTAINER:-missing}" > "${RUNNER_TEMP}/product-diagnostics/stub-server.log" 2>&1

      - name: Stop isolated test stack
        if: always()
        run: |
          set +e
          if [ -n "${MEMORIST_PACKAGE_DIR:-}" ] && [ -f "${MEMORIST_PACKAGE_DIR}/.env" ]; then
            cd "${MEMORIST_PACKAGE_DIR}"
            if [ -n "${MEMORIST_COMPOSE_BIN:-}" ]; then base="$MEMORIST_COMPOSE_BIN"; else base="docker compose"; fi
            $base -f compose.yml -f compose.full.yml down --remove-orphans
          fi
          if [ -n "${MEMORIST_E2E_STUB_CONTAINER:-}" ]; then
            docker rm -f "$MEMORIST_E2E_STUB_CONTAINER" >/dev/null 2>&1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: consolidated-product-e2e-results
          path: |
            tests/e2e/playwright-report
            tests/e2e/playwright-results.json
            tests/e2e/test-results
            ${{ runner.temp }}/product-diagnostics
