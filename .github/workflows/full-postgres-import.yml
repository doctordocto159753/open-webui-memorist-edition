name: PR3 Import Runtime Certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pr3-apply-idle-finalization-fix:
    name: Apply Idle Finalization Repair
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/pr3-post-merge-certification-repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr3-post-merge-certification-repair
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Apply, test, and push repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          stage=edit
          trap 'code=$?; gh pr comment 36 --body "Idle-finalization repair transport failed at stage: ${stage} (exit ${code})." || true; exit ${code}' ERR
          if grep -q 'def finalize_ready_runs' memorist-core/src/memcore/imports/processing.py; then
            echo "Idle finalization repair already applied."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          processing = Path("memorist-core/src/memcore/imports/processing.py")
          source = processing.read_text()
          old = '''    def finalize_if_terminal(self, import_run_uuid: str) -> bool:\n        report = self.processing_report(import_run_uuid)\n'''
          new = '''    def finalize_ready_runs(self, import_run_uuid: str | None = None) -> int:\n        params: tuple[Any, ...] = ()\n        run_filter = ""\n        if import_run_uuid is not None:\n            run_filter = "AND run.import_run_uuid = ?"\n            params = (import_run_uuid,)\n        placeholders = ", ".join("?" for _ in TERMINAL_STATUSES)\n        rows = self.connection.execute(\n            f"""\n            SELECT run.import_run_uuid\n            FROM import_runs run\n            WHERE run.status = 'processing'\n              {run_filter}\n              AND NOT EXISTS (\n                SELECT 1\n                FROM import_message_processing_status status\n                WHERE status.import_run_uuid = run.import_run_uuid\n                  AND status.status NOT IN ({placeholders})\n              )\n            ORDER BY run.created_at, run.import_run_uuid\n            """,\n            params + tuple(sorted(TERMINAL_STATUSES)),\n        ).fetchall()\n        finalized = 0\n        for row in rows:\n            finalized += int(self.finalize_if_terminal(str(row["import_run_uuid"])))\n        return finalized\n\n    def finalize_if_terminal(self, import_run_uuid: str) -> bool:\n        report = self.processing_report(import_run_uuid)\n'''
          if source.count(old) != 1:
              raise RuntimeError("finalize insertion target changed")
          source = source.replace(old, new, 1)
          old = '''        elif not report["terminal"]:\n            with self.connection:\n                self.connection.execute(\n                    """\n                    UPDATE import_runs\n                    SET status = 'processing', completed_at = NULL\n                    WHERE import_run_uuid = ?\n                    """,\n                    (import_run_uuid,),\n                )\n            return False\n'''
          new = '''        elif not report["terminal"]:\n            return False\n'''
          if source.count(old) != 1:
              raise RuntimeError("nonterminal finalization target changed")
          processing.write_text(source.replace(old, new, 1))

          worker = Path("memorist-core/src/memcore/imports/worker.py")
          source = worker.read_text()
          old = '''            if claimed is None:\n                return False\n'''
          new = '''            if claimed is None:\n                processor.finalize_ready_runs(import_run_uuid)\n                return False\n'''
          if source.count(old) != 1:
              raise RuntimeError("idle worker target changed")
          worker.write_text(source.replace(old, new, 1))

          lifecycle = Path("memorist-core/tests/test_import_worker_lifecycle.py")
          source = lifecycle.read_text()
          old = "import json\nimport threading\n"
          new = "import json\nimport sqlite3\nimport threading\n"
          if source.count(old) != 1:
              raise RuntimeError("sqlite3 import target changed")
          source = source.replace(old, new, 1)
          marker = '''def test_slow_provider_heartbeat_prevents_a_second_worker_from_stealing(\n'''
          regression = '''def test_idle_worker_retries_terminal_finalization_after_transient_failure(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    settings = _settings(tmp_path, concurrency=1)\n    run_uuid = _commit(settings, tmp_path, monkeypatch, messages=1)\n    original_finalize = ImportMessageProcessor.finalize_if_terminal\n    injected = {"raised": False}\n\n    def fail_first_terminal_finalize(\n        self: ImportMessageProcessor, target_run_uuid: str\n    ) -> bool:\n        report = self.processing_report(target_run_uuid)\n        if report["terminal"] and not injected["raised"]:\n            injected["raised"] = True\n            raise sqlite3.OperationalError("database is locked")\n        return original_finalize(self, target_run_uuid)\n\n    monkeypatch.setattr(\n        ImportMessageProcessor, "finalize_if_terminal", fail_first_terminal_finalize\n    )\n    worker = ImportReconstructionWorkerService(settings)\n    worker.start()\n    try:\n        final = _wait_terminal(settings, run_uuid, timeout=8.0)\n    finally:\n        worker.stop()\n    assert injected["raised"] is True\n    assert final["status"] == "fully_reconstructed"\n\n\n'''
          if source.count(marker) != 1:
              raise RuntimeError("lifecycle regression insertion target changed")
          lifecycle.write_text(source.replace(marker, regression + marker, 1))

          postgres_test = Path("memorist-core/tests/test_full_postgres_import_runtime.py")
          source = postgres_test.read_text()
          old = '''            SELECT COUNT(*) AS total,\n                   COUNT(*) FILTER (\n                     WHERE status IN ('succeeded', 'already_processed')\n                   ) AS done\n            FROM import_message_processing_status\n            WHERE import_run_uuid = ? AND processing_stage = 'memory_extraction'\n'''
          new = '''            SELECT COUNT(*) FILTER (WHERE status <> 'skipped') AS total,\n                   COUNT(*) FILTER (\n                     WHERE status <> 'skipped'\n                       AND status IN ('succeeded', 'already_processed')\n                   ) AS done,\n                   COUNT(*) FILTER (WHERE status = 'skipped') AS skipped\n            FROM import_message_processing_status\n            WHERE import_run_uuid = ?\n'''
          if source.count(old) != 1:
              raise RuntimeError("PostgreSQL endpoint count target changed")
          source = source.replace(old, new, 1)
          old = '''    assert int(statuses["total"]) == 4\n    assert int(statuses["done"]) == 4\n'''
          new = '''    assert int(statuses["total"]) == 4\n    assert int(statuses["done"]) == 4\n    assert int(statuses["skipped"]) == 1\n'''
          if source.count(old) != 1:
              raise RuntimeError("PostgreSQL endpoint assertion target changed")
          source = source.replace(old, new, 1)
          old = '''            SELECT status FROM import_message_processing_status\n            WHERE import_run_uuid = ? AND processing_stage = 'memory_extraction'\n'''
          new = '''            SELECT status FROM import_message_processing_status\n            WHERE import_run_uuid = ? AND status <> 'skipped'\n'''
          if source.count(old) != 1:
              raise RuntimeError("PostgreSQL restart selection target changed")
          source = source.replace(old, new, 1)
          old = '''    assert duplicates == []\n    assert all(row["status"] in {"succeeded", "already_processed"} for row in statuses)\n'''
          new = '''    assert duplicates == []\n    assert len(statuses) == 2\n    assert all(row["status"] in {"succeeded", "already_processed"} for row in statuses)\n'''
          if source.count(old) != 1:
              raise RuntimeError("PostgreSQL restart assertion target changed")
          postgres_test.write_text(source.replace(old, new, 1))
          PY
          stage=install
          cd memorist-core
          uv sync --all-extras
          stage=format
          uv run ruff format src/memcore/imports/processing.py src/memcore/imports/worker.py tests/test_import_worker_lifecycle.py tests/test_full_postgres_import_runtime.py
          stage=focused-tests
          uv run pytest tests/test_import_worker_lifecycle.py -q
          stage=static
          uv run ruff check src/memcore/imports/processing.py src/memcore/imports/worker.py tests/test_import_worker_lifecycle.py tests/test_full_postgres_import_runtime.py
          uv run mypy src/memcore/imports/processing.py src/memcore/imports/worker.py tests/test_import_worker_lifecycle.py tests/test_full_postgres_import_runtime.py
          cd ..
          git diff --check
          stage=commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memorist-core/src/memcore/imports/processing.py memorist-core/src/memcore/imports/worker.py memorist-core/tests/test_import_worker_lifecycle.py memorist-core/tests/test_full_postgres_import_runtime.py
          git commit -m "Retry terminal import finalization when workers become idle"
          stage=push
          if ! output=$(git push origin HEAD:codex/pr3-post-merge-certification-repair 2>&1); then
            gh pr comment 36 --body "Idle-finalization repair push failed: ${output}"
            exit 1
          fi
