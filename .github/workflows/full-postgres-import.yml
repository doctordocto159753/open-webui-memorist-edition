name: PR3 Import Runtime Certification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pr3-apply-independent-review-fix:
    name: Apply Independent Review Fix
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/pr3-post-merge-certification-repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr3-post-merge-certification-repair
          fetch-depth: 0
      - name: Apply exact reviewed patch and replace transport commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          stage=assemble
          trap 'code=$?; gh pr comment 36 --body "Patch transport failed at stage: ${stage} (exit ${code})." || true; exit ${code}' ERR
          cat .github/pr3-review-patch.* > /tmp/pr3.patch.gz.b64
          test "$(wc -c < /tmp/pr3.patch.gz.b64)" -eq 30408
          echo "9285a57f3a35bc3bd7ed3c00a2c49635cb48fed37df2ef217233f2e96f836092  /tmp/pr3.patch.gz.b64" | sha256sum --check
          stage=decode
          base64 --decode /tmp/pr3.patch.gz.b64 | gzip -d > /tmp/pr3.patch
          echo "269b1240790ccc1f501afafd7086c0750d18bc4c5ac71f9aae0553ecab0d2d9f  /tmp/pr3.patch" | sha256sum --check
          stage=reset
          git reset --hard a15303e6a05165ad5f22770e834c52ddaa920a9f
          git clean -fdx
          stage=apply
          git apply --binary /tmp/pr3.patch
          git diff --check
          test ! -e .github/pr3-review-patch.00
          stage=commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make import result commits lease-fenced and atomic"
          stage=push
          git push --force origin HEAD:codex/pr3-post-merge-certification-repair

  pr3-lite-import-integration:
    name: PR3 Lite Import Integration
    runs-on: ubuntu-latest
    env:
      MEMORIST_RUNTIME_PROFILE: lite
      MEMORIST_CANONICAL_STORE: sqlite
      MEMORIST_IMPORT_RECONSTRUCTION_WORKER_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: memorist-core
        run: uv sync --all-extras
      - name: Lite import integration
        working-directory: memorist-core
        run: uv run pytest tests/test_official_chatgpt_import.py -q --junitxml=lite-results.xml
      - name: Reject skipped lite certification tests
        working-directory: memorist-core
        run: uv run python -c "import xml.etree.ElementTree as E; r=E.parse('lite-results.xml').getroot(); cases=list(r.iter('testcase')); assert cases and not list(r.iter('skipped'))"

  pr3-full-postgres-import-e2e:
    name: PR3 Full PostgreSQL Import E2E
    runs-on: ubuntu-latest
    services: &postgres_service
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memorist
          POSTGRES_PASSWORD: memorist
          POSTGRES_DB: memorist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memorist -d memorist_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env: &postgres_env
      MEMORIST_RUNTIME_PROFILE: full
      MEMORIST_CANONICAL_STORE: postgres
      MEMORIST_POSTGRES_DSN: postgresql://memorist:memorist@localhost:5432/memorist_test
      MEMORIST_OBJECT_STORE_PATH: /tmp/memorist-objects
      MEMORIST_ALLOW_FULL_GRAPH_DEGRADED: "true"
      MEMORIST_HOT_SCHEDULER: in_memory
      MEMORIST_IMPORT_RECONSTRUCTION_WORKER_ENABLED: "true"
      MEMORIST_IMPORT_TEST_KEY: ci-secret-value
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: memorist-core
        run: uv sync --all-extras
      - name: Full PostgreSQL import E2E
        working-directory: memorist-core
        run: |
          test -n "$MEMORIST_POSTGRES_DSN"
          uv run pytest tests/test_full_postgres_import_runtime.py -q --junitxml=postgres-results.xml
          uv run python -c "import xml.etree.ElementTree as E; r=E.parse('postgres-results.xml').getroot(); cases=list(r.iter('testcase')); assert cases and not list(r.iter('skipped'))"

  pr3-remote-provider-execution:
    name: PR3 Full PostgreSQL Remote Provider
    runs-on: ubuntu-latest
    services: *postgres_service
    env: *postgres_env
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: memorist-core
        run: uv sync --all-extras
      - name: Remote provider execution
        working-directory: memorist-core
        run: |
          test -n "$MEMORIST_POSTGRES_DSN"
          uv run pytest tests/test_full_postgres_remote_provider.py -q --junitxml=remote-provider-results.xml
          uv run python -c "import xml.etree.ElementTree as E; r=E.parse('remote-provider-results.xml').getroot(); cases=list(r.iter('testcase')); assert cases and not list(r.iter('skipped'))"

  pr3-worker-lifecycle-and-concurrency:
    name: PR3 Worker Lifecycle and Concurrency
    runs-on: ubuntu-latest
    services: *postgres_service
    env: *postgres_env
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: memorist-core
        run: uv sync --all-extras
      - name: Worker lifecycle and concurrency
        working-directory: memorist-core
        run: |
          test -n "$MEMORIST_POSTGRES_DSN"
          uv run pytest tests/test_import_worker_lifecycle.py tests/test_full_postgres_import_runtime.py -q --junitxml=worker-results.xml
          uv run python -c "import xml.etree.ElementTree as E; r=E.parse('worker-results.xml').getroot(); cases=list(r.iter('testcase')); assert cases and not list(r.iter('skipped'))"

  pr3-import-security:
    name: PR3 Import Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: memorist-core
        run: uv sync --all-extras
      - name: Import security tests
        working-directory: memorist-core
        run: |
          uv run pytest tests/test_import_security.py -q --junitxml=security-results.xml
          uv run python -c "import xml.etree.ElementTree as E; r=E.parse('security-results.xml').getroot(); cases=list(r.iter('testcase')); assert cases and not list(r.iter('skipped'))"

  pr3-frontend-workflow:
    name: PR3 Frontend Workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend lint
        run: npm run lint

  pr3-type-and-lint:
    name: PR3 Type and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: memorist-core
        run: uv sync --all-extras
      - name: Ruff
        working-directory: memorist-core
        run: uv run ruff check src tests
      - name: Format check
        working-directory: memorist-core
        run: uv run ruff format --check src tests
      - name: Mypy
        working-directory: memorist-core
        run: uv run mypy src tests
      - name: Diff check
        run: git diff --check
