name: PR4-B Scope Closure Apply

on:
  push:
    branches:
      - codex/pr4b-full-lite-memory-control-contract
    paths: &closure_paths
      - scripts/pr4b_scope_closure.py
      - scripts/pr4b_scope_closure_post.py
      - scripts/pr4b_scope_closure_commit.py
      - scripts/pr4b_scope_closure_connection.py
      - memorist-core/src/memcore/storage/postgres/compat.py
      - memorist-core/src/memcore/storage/postgres/migrations/0014_scoped_model_role_defaults.sql
      - .github/workflows/pr4b-scope-closure-apply.yml
  pull_request:
    branches:
      - main
    paths: *closure_paths

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memorist
          POSTGRES_PASSWORD: memorist
          POSTGRES_DB: memorist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memorist -d memorist_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MEMORIST_POSTGRES_DSN: postgresql://memorist:memorist@localhost:5432/memorist_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr4b-full-lite-memory-control-contract
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Apply asserted scope-closure patch
        run: |
          python scripts/pr4b_scope_closure.py
          python scripts/pr4b_scope_closure_post.py
          python scripts/pr4b_scope_closure_commit.py
          python scripts/pr4b_scope_closure_connection.py
      - name: Install dependencies
        working-directory: memorist-core
        run: uv sync --all-extras
      - name: Format and lint changed Python
        working-directory: memorist-core
        run: |
          set +e
          uv run ruff check --fix \
            src/memcore/api/routes_openwebui.py \
            src/memcore/api/routes_retrieval.py \
            src/memcore/openwebui/commands.py \
            src/memcore/openwebui/model_scheduling.py \
            src/memcore/storage/postgres/compat.py \
            tests/test_pr4b_scope_closure.py \
            ../open-webui-integration/memorist/backend/router.py \
            ../open-webui-integration/memorist/tests/test_backend_proxy.py \
            > ../scope-closure-ruff.log 2>&1
          uv run ruff format \
            src/memcore/api/routes_openwebui.py \
            src/memcore/api/routes_retrieval.py \
            src/memcore/openwebui/commands.py \
            src/memcore/openwebui/model_scheduling.py \
            src/memcore/storage/postgres/compat.py \
            tests/test_pr4b_scope_closure.py \
            ../open-webui-integration/memorist/backend/router.py \
            ../open-webui-integration/memorist/tests/test_backend_proxy.py \
            >> ../scope-closure-ruff.log 2>&1
          uv run ruff check \
            src/memcore/api/routes_openwebui.py \
            src/memcore/api/routes_retrieval.py \
            src/memcore/openwebui/commands.py \
            src/memcore/openwebui/model_scheduling.py \
            src/memcore/storage/postgres/compat.py \
            tests/test_pr4b_scope_closure.py \
            ../open-webui-integration/memorist/backend/router.py \
            ../open-webui-integration/memorist/tests/test_backend_proxy.py \
            >> ../scope-closure-ruff.log 2>&1
          status=$?
          cat ../scope-closure-ruff.log
          exit $status
      - name: Upload patched tree diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr4b-scope-closure-debug
          path: |
            scope-closure-ruff.log
            memorist-core/src/memcore/api/routes_openwebui.py
            memorist-core/src/memcore/api/routes_retrieval.py
            memorist-core/src/memcore/openwebui/commands.py
            memorist-core/src/memcore/openwebui/model_scheduling.py
            memorist-core/src/memcore/storage/postgres/compat.py
            memorist-core/tests/test_pr4b_scope_closure.py
            open-webui-integration/memorist/backend/router.py
            open-webui-integration/memorist/tests/test_backend_proxy.py
            open-webui-integration/memorist/ui/memoristClient.ts
      - name: Validate Lite policy, ownership, and Processing Node scope
        working-directory: memorist-core
        run: |
          set -o pipefail
          MEMORIST_SCOPE_TEST_RUNTIME=lite uv run pytest \
            tests/test_pr4b_scope_closure.py \
            ../open-webui-integration/memorist/tests/test_backend_proxy.py -q \
            2>&1 | tee ../scope-closure-lite.log
      - name: Upload Lite test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr4b-scope-closure-lite
          path: scope-closure-lite.log
      - name: Validate Full PostgreSQL ownership and Processing Node scope
        working-directory: memorist-core
        run: |
          set -o pipefail
          MEMORIST_SCOPE_TEST_RUNTIME=full uv run pytest \
            tests/test_pr4b_scope_closure.py -q --junitxml=scope-closure-full.xml \
            2>&1 | tee ../scope-closure-full.log
          uv run python -c "import xml.etree.ElementTree as E; r=E.parse('scope-closure-full.xml').getroot(); assert list(r.iter('testcase')) and not list(r.iter('skipped'))"
      - name: Upload Full PostgreSQL test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr4b-scope-closure-full
          path: |
            scope-closure-full.log
            memorist-core/scope-closure-full.xml
      - name: Type and diff checks
        working-directory: memorist-core
        run: |
          uv run mypy src
          cd ..
          git diff --check
      - name: Build verified detached commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -f scope-closure-ruff.log scope-closure-lite.log scope-closure-full.log
          rm -f memorist-core/scope-closure-full.xml
          rm -f scripts/pr4b_scope_closure.py scripts/pr4b_scope_closure_post.py
          rm -f scripts/pr4b_scope_closure_commit.py scripts/pr4b_scope_closure_connection.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close PR4-B policy and multi-user scope gaps"
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def git(*args: str) -> bytes:
              return subprocess.check_output(["git", *args])

          def request(method: str, path: str, payload: dict | None = None) -> dict:
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode())

          parent = git("rev-parse", "HEAD^").decode().strip()
          parent_commit = request("GET", f"/git/commits/{parent}")
          entries = []
          changed = git("diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD^", "HEAD")
          for raw_path in changed.decode().splitlines():
              path = raw_path.strip()
              exists = subprocess.run(
                  ["git", "cat-file", "-e", f"HEAD:{path}"],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not exists:
                  entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})
                  continue
              mode = git("ls-tree", "HEAD", "--", path).decode().split()[0]
              content = git("show", f"HEAD:{path}")
              blob = request(
                  "POST",
                  "/git/blobs",
                  {"content": base64.b64encode(content).decode(), "encoding": "base64"},
              )
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]})
          tree = request(
              "POST",
              "/git/trees",
              {"base_tree": parent_commit["tree"]["sha"], "tree": entries},
          )
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "fix: close PR4-B policy and multi-user scope gaps",
                  "tree": tree["sha"],
                  "parents": [parent],
              },
          )
          result = {"commit_sha": commit["sha"], "parent_sha": parent, "tree_sha": tree["sha"]}
          with open("scope-closure-detached-commit.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, sort_keys=True)
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Upload verified detached commit
        uses: actions/upload-artifact@v4
        with:
          name: pr4b-scope-closure-commit
          path: scope-closure-detached-commit.json
