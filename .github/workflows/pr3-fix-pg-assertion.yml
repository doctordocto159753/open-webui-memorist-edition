name: PR3 Fix PostgreSQL Assertion

on:
  push:
    branches: [codex/pr3-post-merge-certification-repair]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct CompatRow value assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('memorist-core/tests/test_full_postgres_import_runtime.py')
          text = path.read_text()
          old = 'assert all(int(value) == 0 for value in artifacts)\n'
          new = 'assert all(int(value) == 0 for value in artifacts.values())\n'
          if text.count(old) != 1:
              raise SystemExit('expected assertion not found exactly once')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/pr3-fix-pg-assertion.yml
          git config user.name "PR3 Independent Reviewer"
          git config user.email "pr3-reviewer@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix PostgreSQL artifact assertion"
          git push origin HEAD:codex/pr3-post-merge-certification-repair
