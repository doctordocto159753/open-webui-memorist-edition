name: PR4-D Final Lint Diagnostic

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr4d-final-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  final-lint:
    name: PR4-D Final Lint Diagnostic
    runs-on: [self-hosted, linux, x64, memorist-ci]
    steps:
      - name: Apply exact ruff import ordering
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: doctordocto159753/open-webui-memorist-edition
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: codex/pr4d-canonical-semantic-authority-parity
        run: |
          W=/home/github-runner/actions-runner/_work/open-webui-memorist-edition/open-webui-memorist-edition
          A="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          U=/home/github-runner/actions-runner/_work/_tool/uv/0.11.28/x86_64/uv
          [ -x "$U" ] || U=/home/github-runner/.local/bin/uv
          cd "$W"
          git remote set-url origin "$A"
          git fetch --quiet origin "$HEAD_SHA"
          git checkout --quiet "$HEAD_SHA"
          cd memorist-core
          "$U" sync --all-extras --quiet
          "$U" run ruff check --fix \
            src/memcore/memory_worker/semantic/routing_policy.py
          cd ..
          if git diff --quiet -- memorist-core/src/memcore/memory_worker/semantic/routing_policy.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memorist-core/src/memcore/memory_worker/semantic/routing_policy.py
          git commit -m "style: apply exact ruff import ordering"
          git push "$A" "HEAD:${HEAD_BRANCH}"
