name: One-shot PR54 certification refresh repair

on:
  push:
    branches:
      - codex/ci-consolidated-public-safe-runners
    paths:
      - .github/workflows/one-shot-fix-pr54-certification-race.yml

permissions:
  contents: write

jobs:
  patch-and-remove-self:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/ci-consolidated-public-safe-runners
          fetch-depth: 1
          persist-credentials: true

      - name: Wait for the exact row to reflect current certification
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/e2e/product.spec.ts")
          text = path.read_text(encoding="utf-8")
          old = '''  await expect
    .poll(
      async () => {
        const response = await apiFetch(page, "/api/v1/memorist/model-control/profiles");
        if (response.status !== 200) return false;
        const items = (response.body as { items?: E2EProfile[] }).items || [];
        const profile = items.find((item) => item.model_profile_uuid === profileUuid);
        return profile?.certification_current === true;
      },
      { timeout: 30_000 },
    )
    .toBe(true);

  await nodes.locator('[name="default_role"]').selectOption("memory_extraction");
'''
          new = '''  await expect
    .poll(
      async () => {
        const response = await apiFetch(page, "/api/v1/memorist/model-control/profiles");
        if (response.status !== 200) return false;
        const items = (response.body as { items?: E2EProfile[] }).items || [];
        const profile = items.find((item) => item.model_profile_uuid === profileUuid);
        return profile?.certification_current === true;
      },
      { timeout: 30_000 },
    )
    .toBe(true);

  // The profile test completes asynchronously inside the web component. The
  // API can become current a few milliseconds before the component's final
  // refresh replaces its local profile snapshot. Wait for the exact row to
  // render that refreshed certification before invoking the UI default action.
  const profileRow = nodes
    .locator(`[data-action="test"][data-profile="${profileUuid}"]`)
    .locator("xpath=ancestor::tr");
  await expect(profileRow).toContainText(/certification current/i, {
    timeout: 30_000,
  });

  await nodes.locator('[name="default_role"]').selectOption("memory_extraction");
'''
          if old not in text:
              raise SystemExit("expected certification/default block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Remove one-shot workflow and commit the source repair
        run: |
          rm .github/workflows/one-shot-fix-pr54-certification-race.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/product.spec.ts .github/workflows/one-shot-fix-pr54-certification-race.yml
          git commit -m "Synchronize E2E default assignment with certification refresh"
          git push origin HEAD:codex/ci-consolidated-public-safe-runners
