name: PR4-D Temporary Pipeline Patcher

on:
  push:
    branches: [codex/pr4d-canonical-semantic-authority-parity]
    paths:
      - .github/workflows/pr4d-pipeline-patcher.yml
      - .github/pr4d-pipeline-patch-request
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-postgres-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Patch Full deterministic fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('memorist-core/src/memcore/memory_worker/postgres/pipeline.py')
          text = path.read_text()

          import_anchor = (
              'from memcore.memory_worker.providers.openai_compatible import (\n'
              '    OpenAICompatibleMemoryExtractionProvider,\n'
              ')\n'
              'from memcore.memory_worker.segmentation.sentence_segmenter import SentenceSegmenter\n'
          )
          import_replacement = (
              'from memcore.memory_worker.providers.openai_compatible import (\n'
              '    OpenAICompatibleMemoryExtractionProvider,\n'
              ')\n'
              'from memcore.memory_worker.segmentation.sentence_segmenter import SentenceSegmenter\n'
              'from memcore.memory_worker.semantic.factors import resolve_semantic_factors\n'
          )
          if 'from memcore.memory_worker.semantic.factors import resolve_semantic_factors' not in text:
              if import_anchor not in text:
                  raise SystemExit('import anchor not found')
              text = text.replace(import_anchor, import_replacement, 1)

          old = '''    def _deterministic_jakobson_output(self, units: list[dict[str, Any]]) -> dict[str, Any]:
        sentences = []
        for idx, unit in enumerate(units, start=1):
            text = unit["text"]
            sentences.append(
                {
                    "id": idx,
                    "text": text,
                    "six_factors": {
                        "sender_addresser": {
                            "value": "user",
                            "evidence": text,
                            "confidence": "medium",
                        },
                        "receiver_addressee": {
                            "value": "assistant",
                            "evidence": text,
                            "confidence": "medium",
                        },
                        "message": {"value": text, "evidence": text, "confidence": "high"},
                        "context_referent": {
                            "value": text,
                            "evidence": text,
                            "confidence": "medium",
                        },
                        "code": {
                            "value": "natural language",
                            "evidence": text,
                            "confidence": "medium",
                        },
                        "contact_channel": {
                            "value": "chat",
                            "evidence": text,
                            "confidence": "medium",
                        },
                    },
                    "dominant_function": "referential",
                    "secondary_functions": [],
                    "function_reason": "Deterministic fallback classifies the sentence as referential.",
                    "notes": "deterministic fallback",
                }
            )
        return {
            "schema_version": "1.0",
            "prompt_id": JAKOBSON_SENTENCE_ANALYSIS_PROMPT_ID,
            "prompt_version": PROMPT_PACK_VERSION,
            "status": "ok",
            "warnings": ["deterministic_fallback"],
            "items": [],
            "analysis_level": "sentence",
            "model": "jakobson_six_factor",
            "input_language": "mixed",
            "sentence_count": len(sentences),
            "sentences": sentences,
            "overall_summary": {
                "dominant_overall_function": "referential",
                "secondary_overall_functions": [],
                "main_sender": "user",
                "main_receiver": "assistant",
                "main_context": "conversation",
                "main_code": "natural language",
                "main_contact_channel": "chat",
            },
        }
'''
          new = '''    def _deterministic_jakobson_output(self, units: list[dict[str, Any]]) -> dict[str, Any]:
        sentences = []
        for idx, unit in enumerate(units, start=1):
            text = unit["text"]
            semantic_factors = resolve_semantic_factors(text)
            sentences.append(
                {
                    "id": idx,
                    "text": text,
                    "six_factors": {
                        "sender_addresser": {
                            "value": "user",
                            "evidence": text,
                            "confidence": "medium",
                        },
                        "receiver_addressee": {
                            "value": semantic_factors.receiver.value,
                            "evidence": semantic_factors.receiver.evidence,
                            "confidence": semantic_factors.receiver.confidence,
                        },
                        "message": {"value": text, "evidence": text, "confidence": "high"},
                        "context_referent": {
                            "value": semantic_factors.context.value,
                            "evidence": semantic_factors.context.evidence,
                            "confidence": semantic_factors.context.confidence,
                        },
                        "code": {
                            "value": "natural language",
                            "evidence": text,
                            "confidence": "medium",
                        },
                        "contact_channel": {
                            "value": "chat",
                            "evidence": text,
                            "confidence": "medium",
                        },
                    },
                    "dominant_function": "referential",
                    "secondary_functions": [],
                    "function_reason": "Deterministic fallback classifies the sentence as referential.",
                    "notes": "deterministic fallback",
                }
            )
        receiver_values = [
            sentence["six_factors"]["receiver_addressee"]["value"]
            for sentence in sentences
            if sentence["six_factors"]["receiver_addressee"]["value"]
        ]
        context_values = [
            sentence["six_factors"]["context_referent"]["value"]
            for sentence in sentences
            if sentence["six_factors"]["context_referent"]["value"]
        ]
        return {
            "schema_version": "1.0",
            "prompt_id": JAKOBSON_SENTENCE_ANALYSIS_PROMPT_ID,
            "prompt_version": PROMPT_PACK_VERSION,
            "status": "ok",
            "warnings": ["deterministic_fallback"],
            "items": [],
            "analysis_level": "sentence",
            "model": "jakobson_six_factor",
            "input_language": "mixed",
            "sentence_count": len(sentences),
            "sentences": sentences,
            "overall_summary": {
                "dominant_overall_function": "referential",
                "secondary_overall_functions": [],
                "main_sender": "user",
                "main_receiver": receiver_values[0] if receiver_values else None,
                "main_context": context_values[0] if context_values else None,
                "main_code": "natural language",
                "main_contact_channel": "chat",
            },
        }
'''
          if new not in text:
              if old not in text:
                  raise SystemExit('deterministic fallback block not found')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No pipeline patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memorist-core/src/memcore/memory_worker/postgres/pipeline.py
          git commit -m "PR4-D Task 03: wire Full fallback factor resolver"
          git push
