name: Public Release Readiness

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-links:
    name: Docs and Links
    runs-on: [self-hosted, linux, x64, memorist-ci]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - name: Canonical documentation set exists
        run: |
          for f in README.md LICENSE SECURITY.md CONTRIBUTING.md RELEASE_NOTES.md \
                   docs/ARCHITECTURE.md docs/INSTALLATION.md docs/MEMORY_MACHINE.md \
                   docs/DEVELOPMENT.md docs/TROUBLESHOOTING.md docs/reference/README.md; do
            [ -f "$f" ] && echo "OK $f" || { echo "MISSING $f"; exit 1; }
          done
      - name: Relative Markdown links resolve
        run: python3 scripts/check_doc_links.py
      - name: README/docs keep CI-pinned contract strings
        run: |
          grep -q "Model Control Plane" README.md
          grep -q "main_chat_observed" README.md
          grep -q "memory_extraction" README.md
          grep -q "privacy acknowledgement" README.md
          grep -q "Model Control Plane path" docs/ARCHITECTURE.md
          grep -q "embedding" docs/ARCHITECTURE.md
          echo "OK: doc contract strings present"

  repo-hygiene:
    name: Repo Hygiene
    runs-on: [self-hosted, linux, x64, memorist-ci]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - name: No committed env files, archives, databases, or logs
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^e]|\.zip$|\.sqlite$|\.db$|\.log$|\.tmp$' || true)
          if [ -n "$bad" ]; then echo "FORBIDDEN tracked files:"; echo "$bad"; exit 1; fi
          echo "OK: no forbidden tracked files"
      - name: No AI-agent session links or generated footers in tracked files
        run: |
          bad=$(git grep -lIE "claude\.ai/code/session|Generated with \[Claude Code\]|Co-Authored-By: Claude" -- . ':!.github/workflows/public-release-readiness.yml' || true)
          if [ -n "$bad" ]; then echo "Agent artifacts found in:"; echo "$bad"; exit 1; fi
          echo "OK: no agent artifacts in tracked files"
      - name: No obvious real secrets in tracked text files
        run: |
          bad=$(git grep -nIE "sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA |EC )?PRIVATE KEY" -- . || true)
          if [ -n "$bad" ]; then echo "Secret-like content found:"; echo "$bad"; exit 1; fi
          echo "OK: no secret-like content"

  installer-static:
    name: Installer Static Validation
    runs-on: [self-hosted, linux, x64, memorist-ci]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - name: Require an authoritative Compose CLI
        run: bash .github/scripts/ensure-compose.sh
      - name: Installer static checks
        run: python3 installer/scripts/validate_installer.py --dry-run
      - name: Release Compose validation
        run: python3 installer/scripts/validate_compose.py
      - name: Package checksums are current
        run: python3 release/memorist-openwebui/scripts/gen_checksums.py --check

  core-checks:
    name: Core Smoke / Type / Lint
    runs-on: [self-hosted, linux, x64, memorist-ci]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Install backend dependencies
        working-directory: memorist-core
        run: uv sync --all-extras --quiet
      - name: Docs/code consistency test
        working-directory: memorist-core
        run: uv run pytest tests/test_model_control_plane.py -k docs -q --tb=short
      - name: Core health smoke
        working-directory: memorist-core
        run: uv run pytest tests/test_health.py tests/test_config.py -q --tb=short

  frontend-smoke:
    name: Frontend Integration Smoke
    runs-on: [self-hosted, linux, x64, memorist-ci]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Frontend component contracts
        run: npm test
      - name: Type and lint checks
        run: |
          npm run typecheck
          npm run lint
