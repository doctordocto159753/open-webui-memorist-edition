name: PR3 Independent Review Publisher

on:
  push:
    branches: [codex/pr3-post-merge-certification-repair]

permissions:
  contents: write

jobs:
  publish-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply independently verified fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/pr3-independent-review-fix.patch.gz.b64 | gzip -dc > /tmp/pr3-review.patch
          git apply --check /tmp/pr3-review.patch
          git apply /tmp/pr3-review.patch
          rm .github/pr3-independent-review-fix.patch.gz.b64
          rm .github/workflows/pr3-independent-review-publish.yml
          git config user.name "PR3 Independent Reviewer"
          git config user.email "pr3-reviewer@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix import lease and job-state alignment"
          git push origin HEAD:codex/pr3-post-merge-certification-repair
