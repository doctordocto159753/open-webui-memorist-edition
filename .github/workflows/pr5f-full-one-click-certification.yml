name: PR5-F Full One-Click Certification

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr5f-full-one-click-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-static:
    name: Release Package Static Validation
    runs-on: [self-hosted, linux, x64, memorist-ci]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - name: Require Docker and Compose
        run: bash .github/scripts/ensure-compose.sh --require-docker
      - run: python3 installer/scripts/validate_installer.py --dry-run
      - run: python3 installer/scripts/validate_compose.py
      - name: Regenerate source-package checksums
        run: python3 release/memorist-openwebui/scripts/gen_checksums.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr5f-generated-source-checksums
          path: release/memorist-openwebui/checksums.sha256
      - name: Committed source-package checksums are current
        run: git diff --exit-code -- release/memorist-openwebui/checksums.sha256
      - name: Shell syntax
        run: find release/memorist-openwebui/scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n

  self-contained-package:
    name: Self-Contained Package Integrity and Full Dry Run
    runs-on: [self-hosted, linux, x64, memorist-ci]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - name: Require Docker and Compose
        run: bash .github/scripts/ensure-compose.sh --require-docker
      - name: Require PowerShell
        run: bash .github/scripts/ensure-pwsh.sh
      - name: Assemble release archive
        run: python3 installer/scripts/assemble_rc.py
      - name: Extract outside checkout into a path containing spaces
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find release/rc -maxdepth 1 -type f -name 'memorist-openwebui-*.zip' | sort)
          if [ "${#archives[@]}" -ne 1 ]; then
            printf 'Expected exactly one assembled release ZIP, found %s\n' "${#archives[@]}"
            printf '%s\n' "${archives[@]:-}"
            exit 1
          fi
          target="${RUNNER_TEMP}/Memorist Full Test"
          rm -rf "$target" && mkdir -p "$target"
          unzip -q "${archives[0]}" -d "$target"
          pkg=$(find "$target" -maxdepth 2 -type f -name 'Memorist.cmd' -printf '%h\n' | head -1)
          test -n "$pkg"
          test -f "$pkg/compose.yml"
          test -f "$pkg/compose.full.yml"
          test -d "$pkg/runtime/memorist-core"
          test -d "$pkg/runtime/open-webui-integration"
          ! grep -R -E 'context:[[:space:]]*\.\./|source:[[:space:]]*\.\./' "$pkg"/compose*.yml
          (
            cd "$pkg"
            python3 scripts/gen_checksums.py --check
            pwsh -NoProfile -File ./Install-Memorist.ps1 -Mode full -DryRun -NonInteractive -NoBrowser
            test ! -f .env
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr5f-self-contained-package
          path: |
            release/rc/*.zip
            release/rc/*.sha256

  full-live-and-external:
    name: Full Live PostgreSQL FalkorDB and External Certification
    runs-on: [self-hosted, linux, x64, memorist-ci]
    timeout-minutes: 90
    env:
      MEMORIST_FULL_COMPOSE_SMOKE: "true"
      MEMORIST_FULL_SMOKE_AUTO_DOCKER: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Require live Docker and Compose
        run: bash .github/scripts/ensure-compose.sh --require-docker
      - name: Install test dependencies
        working-directory: memorist-core
        run: uv sync --all-extras --quiet
      - name: Run all eleven authoritative gates
        run: uv run --project memorist-core python scripts/full_mode_check.py
      - name: Assert exact certification result
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('release/artifacts/full-mode-certification-report.ijson'))
          assert r['summary'] == {'passed': 11, 'failed': 0, 'skipped_or_manual': 0, 'all_required_passed': True, 'skipped_manual_blocks_certification': False, 'critical_failures': []}
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr5f-full-certification
          path: |
            release/artifacts/full-mode-certification-report.ijson
            release/artifacts/full-mode-certification-report.md
            release/artifacts/logs/**

  powershell-lifecycle:
    name: PowerShell Lifecycle Contract Tests
    runs-on: [self-hosted, linux, x64, memorist-ci]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          persist-credentials: false
          show-progress: false
      - name: Require PowerShell for lifecycle validation
        run: bash .github/scripts/ensure-pwsh.sh
      - name: Require Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Prefer an already-installed Pester (self-hosted runners often ship
          # one and cannot always reach the PowerShell Gallery); only register
          # the gallery and install when a compatible version is genuinely
          # missing.
          $pester = Get-Module -ListAvailable -Name Pester |
            Where-Object { $_.Version -ge [version]'5.5.0' } |
            Sort-Object Version -Descending | Select-Object -First 1
          if (-not $pester) {
            if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
              Register-PSRepository -Default
            }
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -AllowClobber
          } else {
            Write-Host "Using preinstalled Pester $($pester.Version)"
          }
      - name: Parse and test lifecycle scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem release/memorist-openwebui -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw "PowerShell parse failed: $($_.FullName)" }
          }
          if (-not (Get-Module -ListAvailable Pester)) { throw 'Pester is required; refusing false-green skip' }
          $config = New-PesterConfiguration
          $config.Run.Path = 'release/memorist-openwebui/tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'release/artifacts/pester-results.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr5f-pester-results
          path: release/artifacts/pester-results.xml
