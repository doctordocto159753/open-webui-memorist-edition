name: PR4-D Focused Diagnostic

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ruff-import-diagnostic:
    name: PR4-D Ruff Import Diagnostic
    runs-on: [self-hosted, linux, x64, memorist-ci]
    steps:
      - name: Print ruff import diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: doctordocto159753/open-webui-memorist-edition
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          W=/home/github-runner/actions-runner/_work/open-webui-memorist-edition/open-webui-memorist-edition; A="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"; U=/home/github-runner/actions-runner/_work/_tool/uv/0.11.28/x86_64/uv; [ -x "$U" ] || U=/home/github-runner/.local/bin/uv; cd "$W" && git remote set-url origin "$A" && git fetch --quiet origin "$HEAD_SHA" && git checkout --quiet "$HEAD_SHA" && cd memorist-core && "$U" run ruff check --fix --diff src/memcore/memory_worker/postgres/routing_policy_adapter.py
