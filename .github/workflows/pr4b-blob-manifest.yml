name: PR4-B Verified Blob Manifest

on:
  push:
    branches:
      - codex/pr4b-full-lite-memory-control-contract
    paths: &manifest_paths
      - .github/workflows/pr4b-blob-manifest.yml
  pull_request:
    branches:
      - main
    paths: *manifest_paths

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr4b-full-lite-memory-control-contract
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Reproduce verified product tree
        run: |
          python scripts/pr4b_scope_closure.py
          python scripts/pr4b_scope_closure_post.py
          python scripts/pr4b_scope_closure_commit.py
          python scripts/pr4b_scope_closure_connection.py
          cd memorist-core
          uv sync --all-extras
          uv run ruff check --fix \
            src/memcore/api/routes_openwebui.py \
            src/memcore/api/routes_retrieval.py \
            src/memcore/openwebui/commands.py \
            src/memcore/openwebui/model_scheduling.py \
            src/memcore/storage/postgres/compat.py \
            tests/test_pr4b_scope_closure.py \
            ../open-webui-integration/memorist/backend/router.py \
            ../open-webui-integration/memorist/tests/test_backend_proxy.py
          uv run ruff format \
            src/memcore/api/routes_openwebui.py \
            src/memcore/api/routes_retrieval.py \
            src/memcore/openwebui/commands.py \
            src/memcore/openwebui/model_scheduling.py \
            src/memcore/storage/postgres/compat.py \
            tests/test_pr4b_scope_closure.py \
            ../open-webui-integration/memorist/backend/router.py \
            ../open-webui-integration/memorist/tests/test_backend_proxy.py
      - name: Create verified blob manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -f scripts/pr4b_scope_closure.py scripts/pr4b_scope_closure_post.py
          rm -f scripts/pr4b_scope_closure_commit.py scripts/pr4b_scope_closure_connection.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close PR4-B policy and multi-user scope gaps"
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def git(*args: str) -> bytes:
              return subprocess.check_output(["git", *args])

          def request(path: str, payload: dict) -> dict:
              req = urllib.request.Request(
                  api + path,
                  data=json.dumps(payload).encode(),
                  headers=headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      return json.loads(response.read().decode())
              except urllib.error.HTTPError as error:
                  body = error.read().decode(errors="replace")
                  raise RuntimeError(f"POST {path} -> {error.code}: {body}") from error

          parent = git("rev-parse", "HEAD^").decode().strip()
          entries = []
          changed = git("diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD^", "HEAD")
          for path in changed.decode().splitlines():
              exists = subprocess.run(
                  ["git", "cat-file", "-e", f"HEAD:{path}"],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not exists:
                  entries.append({"path": path, "sha": None})
                  continue
              mode = git("ls-tree", "HEAD", "--", path).decode().split()[0]
              content = git("show", f"HEAD:{path}")
              blob = request(
                  "/git/blobs",
                  {"content": base64.b64encode(content).decode(), "encoding": "base64"},
              )
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]})
          manifest = {
              "parent_sha": parent,
              "local_tree_sha": git("rev-parse", "HEAD^{tree}").decode().strip(),
              "entries": entries,
          }
          with open("pr4b-verified-blob-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
          print(json.dumps(manifest, sort_keys=True))
          PY
      - name: Upload verified blob manifest
        uses: actions/upload-artifact@v4
        with:
          name: pr4b-verified-blob-manifest
          path: pr4b-verified-blob-manifest.json
