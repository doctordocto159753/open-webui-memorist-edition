name: PR4-B Memory Control Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lite-contract:
    name: Memory Control Contract — Lite
    runs-on: ubuntu-latest
    env:
      MEMORIST_RUNTIME_PROFILE: lite
      MEMORIST_CANONICAL_STORE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: memorist-core
        run: uv sync --all-extras
      - name: Lite contract and Open WebUI filter
        working-directory: memorist-core
        run: |
          uv run pytest tests/test_memory_control_contract_lite.py tests/test_memory_control_runtime_parity.py -k "not full_postgres" ../open-webui-integration/memorist/tests -q --junitxml=lite-contract.xml
          uv run python -c "import xml.etree.ElementTree as E; r=E.parse('lite-contract.xml').getroot(); cases=list(r.iter('testcase')); assert cases and not list(r.iter('skipped'))"

  full-postgres-contract:
    name: Memory Control Contract — Full PostgreSQL
    runs-on: ubuntu-latest
    services: &postgres
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memorist
          POSTGRES_PASSWORD: memorist
          POSTGRES_DB: memorist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memorist -d memorist_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env: &full_env
      MEMORIST_RUNTIME_PROFILE: full
      MEMORIST_CANONICAL_STORE: postgres
      MEMORIST_POSTGRES_DSN: postgresql://memorist:memorist@localhost:5432/memorist_test
      MEMORIST_FALKORDB_URL: redis://127.0.0.1:1
      MEMORIST_ALLOW_FULL_GRAPH_DEGRADED: "true"
      MEMORIST_HOT_SCHEDULER: in_memory
      MEMORIST_OBJECT_STORE_PATH: /tmp/memorist-objects
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: memorist-core
        run: uv sync --all-extras
      - name: Full PostgreSQL contract
        working-directory: memorist-core
        run: |
          uv run pytest tests/test_memory_control_contract_full.py tests/test_memory_control_runtime_parity.py -q --junitxml=full-contract.xml
          FAKE_RUNTIME_PROFILE=full uv run pytest ../open-webui-integration/memorist/tests/test_filter_contract.py -q
          uv run python -c "import xml.etree.ElementTree as E; r=E.parse('full-contract.xml').getroot(); cases=list(r.iter('testcase')); assert cases and not list(r.iter('skipped'))"

  graph-contract:
    name: Full Graph Retrieval and Degraded Mode
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memorist
          POSTGRES_PASSWORD: memorist
          POSTGRES_DB: memorist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memorist -d memorist_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MEMORIST_RUNTIME_PROFILE: full
      MEMORIST_CANONICAL_STORE: postgres
      MEMORIST_POSTGRES_DSN: postgresql://memorist:memorist@localhost:5432/memorist_test
      MEMORIST_FALKORDB_URL: redis://localhost:6379
      MEMORIST_ALLOW_FULL_GRAPH_DEGRADED: "true"
      MEMORIST_HOT_SCHEDULER: in_memory
      MEMORIST_OBJECT_STORE_PATH: /tmp/memorist-objects
      MEMORIST_REAL_FALKORDB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: memorist-core
        run: uv sync --all-extras
      - name: Real graph and explicit degradation
        working-directory: memorist-core
        run: |
          uv run pytest tests/test_memory_control_contract_full.py -k "full_graph_retrieval or full_graph_outage" -q --junitxml=graph-contract.xml
          uv run python -c "import xml.etree.ElementTree as E; r=E.parse('graph-contract.xml').getroot(); cases=list(r.iter('testcase')); assert len(cases) == 2 and not list(r.iter('skipped'))"

  attachment-security:
    name: Attachment Security
    runs-on: ubuntu-latest
    services: *postgres
    env: *full_env
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: memorist-core
        run: uv sync --all-extras
      - name: Scope, substitution, and runtime-switch protection
        working-directory: memorist-core
        run: |
          MEMORIST_RUNTIME_PROFILE=lite MEMORIST_CANONICAL_STORE=sqlite uv run pytest tests/test_memory_control_contract_lite.py -k "attachment_authorization or request_cannot_switch" -q
          uv run pytest tests/test_memory_control_runtime_parity.py tests/test_memory_control_contract_full.py -k "policy_attachment_and_restart or full_graph_retrieval" -q --junitxml=attachment-full.xml
          uv run python -c "import xml.etree.ElementTree as E; r=E.parse('attachment-full.xml').getroot(); cases=list(r.iter('testcase')); assert cases and not list(r.iter('skipped'))"

  regeneration-contract:
    name: Regeneration Contract
    runs-on: ubuntu-latest
    services: *postgres
    env: *full_env
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: memorist-core
        run: uv sync --all-extras
      - name: Lite and Full regeneration provenance
        working-directory: memorist-core
        run: |
          MEMORIST_RUNTIME_PROFILE=lite MEMORIST_CANONICAL_STORE=sqlite uv run pytest tests/test_memory_control_contract_lite.py -k regeneration -q
          uv run pytest tests/test_memory_control_contract_full.py -k regeneration -q --junitxml=regeneration-full.xml
          uv run python -c "import xml.etree.ElementTree as E; r=E.parse('regeneration-full.xml').getroot(); cases=list(r.iter('testcase')); assert cases and not list(r.iter('skipped'))"

  type-and-lint:
    name: Type and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        working-directory: memorist-core
        run: uv sync --all-extras
      - name: Python lint, format, and type checks
        working-directory: memorist-core
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src
      - name: Frontend checks
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
      - name: Diff check
        run: git diff --check
