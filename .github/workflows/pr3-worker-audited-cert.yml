name: PR3 Audited Worker Certification

on:
  push:
    branches: [codex/pr3-post-merge-certification-repair]

permissions:
  contents: write

jobs:
  worker-certification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memorist
          POSTGRES_PASSWORD: memorist
          POSTGRES_DB: memorist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memorist -d memorist_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MEMORIST_RUNTIME_PROFILE: full
      MEMORIST_CANONICAL_STORE: postgres
      MEMORIST_POSTGRES_DSN: postgresql://memorist:memorist@localhost:5432/memorist_test
      MEMORIST_OBJECT_STORE_PATH: /tmp/memorist-objects
      MEMORIST_ALLOW_FULL_GRAPH_DEGRADED: "true"
      MEMORIST_HOT_SCHEDULER: in_memory
      MEMORIST_IMPORT_RECONSTRUCTION_WORKER_ENABLED: "true"
      MEMORIST_IMPORT_TEST_KEY: ci-secret-value
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: memorist-core
        run: uv sync --all-extras
      - name: Run worker suite and record result
        shell: bash
        run: |
          set +e
          cd memorist-core
          uv run pytest tests/test_import_worker_lifecycle.py tests/test_import_lease_job_alignment.py tests/test_full_postgres_import_runtime.py -vv --tb=long --junitxml=/tmp/worker.xml 2>&1 | tee /tmp/worker.txt
          worker_exit=${PIPESTATUS[0]}
          cd ..
          python - <<'PY' "$GITHUB_SHA" "$worker_exit"
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          sha, worker_exit = sys.argv[1:]
          root = ET.parse('/tmp/worker.xml').getroot()
          cases = list(root.iter('testcase'))
          summary = (
              f'certified_commit={sha}\n'
              f'worker_concurrency_exit={worker_exit}\n'
              f'worker_concurrency_tests={len(cases)} '
              f'failures={len(list(root.iter("failure")))} '
              f'errors={len(list(root.iter("error")))} '
              f'skipped={len(list(root.iter("skipped")))}\n\n'
          )
          output = Path('/tmp/worker.txt').read_text(errors='replace')
          Path('.github/pr3-worker-certification-result.txt').write_text(summary + output)
          PY
          rm .github/workflows/pr3-worker-audited-cert.yml
          git config user.name "PR3 Independent Reviewer"
          git config user.email "pr3-reviewer@users.noreply.github.com"
          git add -A
          git commit -m "Record audited worker concurrency certification"
          git push origin HEAD:codex/pr3-post-merge-certification-repair
          exit "$worker_exit"
