# Legacy source-checkout Compose retained for developer compatibility.
#
# The canonical one-click release orchestration is the self-contained base plus
# mode overlay under release/memorist-openwebui/. Do not use this legacy file to
# certify Full; use docker-compose.full.yml for source Full checks or the shipped
# compose.yml + compose.full.yml pair for release checks.
#
# Profiles:
#   lite  -> Open WebUI + Memorist Core (SQLite, no graph)  [recommended]
#   full  -> legacy graph-only developer profile (not certified Full)
#
# All secrets/keys are read from .env; none are passed on the command line.
services:
  memorist-core:
    profiles: ["lite", "full", "dev"]
    build:
      context: ./memorist-core
    environment:
      MEMORIST_LOCAL_ONLY: ${MEMORIST_LOCAL_ONLY:-true}
      MEMORIST_RUNTIME_PROFILE: ${MEMORIST_RUNTIME_PROFILE:-lite}
      MEMORIST_CANONICAL_STORE: ${MEMORIST_CANONICAL_STORE:-sqlite}
      MEMORIST_DB_PATH: ${MEMORIST_DB_PATH:-/data/memorist.sqlite}
      MEMORIST_OBJECT_STORE_PATH: ${MEMORIST_OBJECT_STORE:-/objects}
      MEMORIST_GRAPH_BACKEND: ${MEMORIST_GRAPH_BACKEND:-disabled}
      MEMORIST_FALKORDB_URL: ${MEMORIST_FALKORDB_URL:-redis://falkordb:6379}
      MEMORIST_PREFLIGHT_ENABLED: ${MEMORIST_PREFLIGHT_ENABLED:-true}
      MEMORIST_PREFLIGHT_TIMEOUT_MS: ${MEMORIST_PREFLIGHT_TIMEOUT_MS:-1200}
      MEMORIST_ATTACHMENT_TOKEN_BUDGET: ${MEMORIST_ATTACHMENT_TOKEN_BUDGET:-1800}
      MEMORIST_ATTACHMENT_MAX_TOKENS: ${MEMORIST_ATTACHMENT_MAX_TOKENS:-1800}
      MEMORIST_ATTACHMENT_CONTEXT_RATIO: ${MEMORIST_ATTACHMENT_CONTEXT_RATIO:-0.10}
      MEMORIST_ATTACHMENT_MIN_TOKENS: ${MEMORIST_ATTACHMENT_MIN_TOKENS:-256}
      MEMORIST_ATTACHMENT_RESERVED_COMPLETION_TOKENS: ${MEMORIST_ATTACHMENT_RESERVED_COMPLETION_TOKENS:-1024}
      MEMORIST_ATTACHMENT_FALLBACK_CONTEXT_WINDOW: ${MEMORIST_ATTACHMENT_FALLBACK_CONTEXT_WINDOW:-8192}
      MEMORIST_FAIL_OPEN: ${MEMORIST_FAIL_OPEN:-true}
      MEMORIST_ACTOR_ASSERTION_SECRET: ${MEMORIST_ACTOR_ASSERTION_SECRET:?required}
      MEMORIST_ACTOR_SERVICE_TOKEN: ${MEMORIST_ACTOR_SERVICE_TOKEN:?required}
      # PR5-C bridge: provider keys resolved by name inside the backend process.
      MEMORIST_MEMORY_EXTRACTION_API_KEY: ${MEMORIST_MEMORY_EXTRACTION_API_KEY:-}
      MEMORIST_HIGH_CONFIDENCE_EXTRACTION_API_KEY: ${MEMORIST_HIGH_CONFIDENCE_EXTRACTION_API_KEY:-}
      MEMORIST_EMBEDDING_API_KEY: ${MEMORIST_EMBEDDING_API_KEY:-}
      MEMORIST_PRIVACY_SENSITIVITY_API_KEY: ${MEMORIST_PRIVACY_SENSITIVITY_API_KEY:-}
      MEMORIST_IMPORT_RECONSTRUCTION_API_KEY: ${MEMORIST_IMPORT_RECONSTRUCTION_API_KEY:-}
    ports:
      - "127.0.0.1:${MEMORIST_PORT:-8777}:8777"
    volumes:
      - memorist-data:/data
      - memorist-objects:/objects
      - memorist-import-staging:/imports
      - memorist-exports:/exports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8777/memcore/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  open-webui:
    profiles: ["lite", "full", "dev"]
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.9.6}
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-me-local-only}
      MEMORIST_CORE_URL: ${MEMORIST_CORE_URL:-http://memorist-core:8777}
      MEMORIST_ENABLED: "true"
      MEMORIST_PREFLIGHT_ENABLED: ${MEMORIST_PREFLIGHT_ENABLED:-true}
      MEMORIST_PREFLIGHT_TIMEOUT_MS: ${MEMORIST_PREFLIGHT_TIMEOUT_MS:-1200}
      MEMORIST_ATTACHMENT_TOKEN_BUDGET: ${MEMORIST_ATTACHMENT_TOKEN_BUDGET:-1800}
      MEMORIST_ATTACHMENT_MAX_TOKENS: ${MEMORIST_ATTACHMENT_MAX_TOKENS:-1800}
      MEMORIST_FAIL_OPEN: ${MEMORIST_FAIL_OPEN:-true}
      MEMORIST_ACTOR_ASSERTION_SECRET: ${MEMORIST_ACTOR_ASSERTION_SECRET:?required}
      MEMORIST_ACTOR_SERVICE_TOKEN: ${MEMORIST_ACTOR_SERVICE_TOKEN:?required}
      MEMORIST_OPENWEBUI_WORKSPACE_UUID: ${MEMORIST_OPENWEBUI_WORKSPACE_UUID:?required}
      PYTHONPATH: /memorist-integration
    command: ["python", "-m", "memorist.backend.openwebui_entrypoint"]
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - openwebui-data:/app/backend/data
      - ./open-webui-integration/memorist:/memorist-integration/memorist:ro
    depends_on:
      memorist-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  falkordb:
    profiles: ["full", "graph"]
    image: falkordb/falkordb@sha256:2496643cabd67e87fd82458383400c049324daec1fe674ba0db4c5bdaca5d25f
    ports:
      - "127.0.0.1:${MEMORIST_FALKORDB_PORT:-6379}:6379"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  openwebui-data:
  memorist-data:
  memorist-objects:
  memorist-import-staging:
  memorist-exports:
  falkordb-data:
